# Desktop entries with `Terminal=true` (nvim.desktop among them) are launched
# through this command. Fuzzel's default is `$TERMINAL -e`, and this session
# sets no TERMINAL, so without this line those entries silently fail to start.
# footclient matches the session: foot runs as a server, and niri's Mod+T
# spawns footclient too.
terminal=footclient

# Which desktop entry fields a typed query is matched against. fuzzel's default
# is `filename,name,generic`, which means the `Keywords=` line an entry carries
# is read and then ignored -- and every entry this repository ships already has
# one. `wifi.desktop` offers `ssid` and `wireless`, `calculator.desktop` offers
# `arithmetic`, and neither has ever matched anything, because the field was
# never in this list.
#
# It is added for the power entries, where the gap is not cosmetic. A user
# reaches for whichever word their previous system used -- shut down, power off,
# halt, restart -- and a launcher that answers to only one word per verb looks
# like a launcher missing the entry rather than one matching narrowly. The cost
# is that every packaged entry's keywords become searchable too, which makes
# some queries return more than they did.
fields=filename,name,generic,keywords

# Colours. Catppuccin Mocha, the palette `.config/swaylock/config` already uses
# -- the same claim `.config/waybar/style.css` makes about its own values. This
# palette is restated in five files in five formats and none of them can share a
# definition, so each one names where its values came from or the set stops
# being checkable against anything.
#
# fuzzel's own default is Solarized Light, so a key left unset here is a
# near-white one. The eleven below are every key `/etc/xdg/fuzzel/fuzzel.ini`
# defines, set together rather than only where the white is visible today: the
# placeholder, the border and the match counter are reached after typing rather
# than at rest, and left alone they would arrive light one state at a time, each
# looking like a fresh fault rather than the remainder of this one.
#
# Every value is opaque. The bar can afford transparency because it pays for it
# with a text shadow; fuzzel has no equivalent setting, so transparency here
# would be a legibility problem with nothing available to spend against it.
[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=6c7086ff
placeholder=6c7086ff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=6c7086ff
border=313244ff

# Vim-style navigation, added alongside the defaults rather than replacing them.
# Every action below still answers to the keys it always did -- the arrows, and
# the emacs pairs Control+p/Control+n and Control+b/Control+f -- because fuzzel
# takes a space-separated list per action, and naming only the new key would drop
# the rest of that list without saying so.
#
# Of the four letters, Control+j and Control+l were free. The other two already
# carried an action, as did Control+d, and fuzzel refuses to start when a
# combination is bound twice -- so each of those three actions is accounted for
# in the same block:
#
#   Control+k was delete-line-forward, which is disabled below.
#   Control+h was delete-prev, which keeps BackSpace.
#   Control+d was delete-next, which keeps Delete and KP_Delete.
#
# Both half-line kills are off, rather than moved out of the way. Deleting to one
# end of a single-line launcher query is a distinction worth no keys here: the
# useful destructive edit is clearing the whole input, so delete-line takes
# Control+d, and the pair that sat on Control+u and Control+k is gone. Control+w
# still deletes a word backward, and BackSpace a character.
#
# Nothing here collides with `.config/niri/config.kdl`: its two non-Mod bindings
# are Ctrl+Print and Ctrl+Alt+Delete, and its h/j/k/l bindings are all
# Mod-prefixed, so they never reach a focused launcher.
[key-bindings]
prev=Up Control+p Control+k
next=Down Control+n Control+j
cursor-left=Left Control+b Control+h
cursor-right=Right Control+f Control+l
delete-prev=BackSpace
delete-next=Delete KP_Delete
delete-line-backward=none
delete-line-forward=none
delete-line=Control+Shift+BackSpace Control+d
