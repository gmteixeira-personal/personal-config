<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Emoji resolve to Noto Color Emoji, not to Font Awesome.

  Font Awesome 6 Free declares coverage of real emoji codepoints (U+1F4C1,
  U+2705 and U+1F47B among them). It is installed for waybar's module icons, so
  it sits in the font set alongside everything else, and unranked it sorted
  ahead of Noto Color Emoji. A terminal drawing an emoji therefore took Font
  Awesome's answer, which for those codepoints is a blank glyph.

  The fix works on sort order, which is what glyph fallback walks. An alias
  with accept appends the family directly after the aliased one, putting Noto
  Color Emoji ahead of Font Awesome while leaving the requested face first.

  It has to be accept and not prefer. prefer inserts ahead of the aliased
  family, which made Noto Color Emoji the primary match for the face itself: a
  font with no Latin coverage, returned as the answer for ordinary text.

  It also has to name concrete faces. Aliasing monospace appends after a name
  rather than after a font, which puts Noto Color Emoji ahead of the system's
  real monospace list and reintroduces that same problem.

  Font Awesome keeps its place in the font set. waybar names it in
  .config/waybar/style.css and every icon on the bar comes from it.

  This rule is only half of what makes emoji render. The other half is which
  build of Noto Color Emoji is installed, and it is not the packaged one.
  Fedora's google-noto-color-emoji-fonts ships Noto-COLRv1.ttf, whose colour
  lives in COLR/CPAL vector paint graphs. fcft, the font library foot draws
  with, does not support COLRv1 and says so in its own README; as of fcft 3.3.3
  it skips a COLRv1 fallback font outright. Ordering it first therefore changed
  nothing: foot skipped it and fell through to Font Awesome's blanks.

  So the font this rule points at is the CBDT build from googlefonts/noto-emoji,
  installed by hand at ~/.local/share/fonts/NotoColorEmoji.ttf. Its colour is in
  CBDT/CBLC bitmap tables, which FreeType rasterizes and fcft supports. Both
  builds declare the family name Noto Color Emoji, so the packaged one must stay
  uninstalled or the two collide on scan order.

  Note for anyone editing the comments here: a double hyphen cannot appear
  inside an XML comment. Fontconfig rejects the whole file when one does, and
  reports it only on stderr, so the rules go silently missing.

  Fontconfig caches are per process. An application already running keeps the
  order it started with until it restarts, and foot in server mode keeps it for
  every window until the server itself is restarted.
-->
<fontconfig>
  <alias binding="strong">
    <family>JetBrainsMono Nerd Font Mono</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
