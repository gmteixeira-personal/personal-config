# Overrides on top of yazi's shipped dark theme. There is no [flavor] line: the
# Catppuccin Mocha flavor under flavors/ is installed but not selected, so what
# follows is the shipped theme with three keys replaced.
#
# Why this file exists at all. yazi's theme names ANSI palette slots -- "blue",
# "gray" -- and .config/foot/foot.ini deliberately leaves those sixteen slots at
# foot's own defaults, on the reasoning recorded there that they are reachable
# only by a program choosing its own colours. yazi is that program, so "blue" is
# foot's #24acd4 and "gray" its #e6e6e6, and nothing in this session chose
# either. Worse, two status-bar elements state a background and no foreground,
# so their text falls through to foot's `foreground=aaaaaa` -- a colour picked
# for ordinary text on a near-black ground, painted here over a mid-blue.
#
# Repainting foot's slots is not the fix and was measured before being ruled
# out. With the foreground unset the text stays #aaaaaa whatever the background
# becomes: 1.10:1 over Mocha blue, 1.23:1 over Mocha sapphire, against the
# 1.14:1 being fixed. The foreground has to be stated here, where yazi reads it.
#
# Every value chosen below is 24-bit for that reason. The one exception is
# marked where it appears.
#
# The row under the cursor is deliberately absent from this file. It measures
# 7.08:1 -- the best-contrasted thing in the window -- so a change made in the
# name of legibility would make it worse, and yazi offers no key for it in any
# case: it highlights that row by reversing the row's own colours, so the only
# lever is the colour every directory row is drawn in.

[mode]
# The mode badge. Shipped as `{ bg = "blue", bold = true }` -- no foreground, so
# its text was foot's #aaaaaa over #24acd4 at 1.14:1, legible only at the
# anti-aliased edges of the glyphs. White takes it to 2.65:1.
#
# 2.65:1 is BELOW the 4.5:1 threshold for readable text. It is recorded here as
# a known position rather than a passed check: it is more than double what it
# replaces, and the badge is three glyphs of bold text rather than a paragraph.
# The better number is dark rather than white -- #11111b over the same blue is
# 7.08:1, which is what the cursor row already gets -- and that is the value to
# put here if the white reads thin in use.
#
# `bg = "blue"` is the one slot name left in this file, and it is retained
# rather than chosen: it is the colour already on screen, the change is not
# about it, and naming a literal would mean picking a blue nobody decided on.
normal_main = { fg = "#ffffff", bg = "blue", bold = true }

# The pale chip beside the badge -- the file size on the left, the scroll
# position on the right. Shipped as `{ fg = "blue", bg = "gray" }`, which is
# #24acd4 on foot's near-white #e6e6e6 at 2.12:1.
#
# surface0 from Catppuccin Mocha, the palette this session restates in five
# files, behind the same blue: 4.75:1, over the threshold. surface1 (#45475a)
# was the alternative and lands at 3.44:1, under it.
normal_alt = { fg = "blue", bg = "#313244" }

[status]
# The position badge at the right end. Shipped as `{ bold = true }` -- the same
# missing foreground as the mode badge, over the same background, so the same
# 1.14:1 and the same 2.65:1 after.
progress_label = { fg = "#ffffff", bold = true }
