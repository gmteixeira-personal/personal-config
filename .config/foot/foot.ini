[main]

# foot terminal configuration
#
# In server mode this file is read ONCE, when `foot --server` starts.
# New footclient windows inherit it; they do not re-read it. After editing:
#   systemctl --user restart foot-server.service
#
# Full reference: man 5 foot.ini

# Login shell for new windows. Set explicitly because the server inherits $SHELL
# from systemd (= /bin/bash, your passwd shell), not from your interactive fish.
shell=/usr/bin/fish

# JetBrainsMono Nerd Font Mono, the patched build from the ryanoasis/nerd-fonts
# v3.5.1 release, installed per-user under ~/.local/share/fonts/. Its Nerd Font
# glyph ranges are what the tide prompt's segment icons and Neovim's mini.icons
# draw from; without them both render every icon as a replacement box, silently.
#
# Fedora's jetbrains-mono-fonts packages the UNPATCHED upstream under the same
# name and carries none of those glyphs, so it is not a substitute.
#
# "Mono" is the single-cell family. The base and Propo families of the same
# release draw the icons double-width and misalign the cell grid -- naming
# "JetBrainsMono Nerd Font" here instead would look right and align wrong.
font=JetBrainsMono Nerd Font Mono:size=11
pad=8x8

[scrollback]
lines=10000
multiplier=3

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

# Ready-made themes live in /usr/share/foot/themes/ — to use one, add:
#   [main]

[csd]
# foot defaults to preferred=server, which under niri with prefer-no-csd gives a
# border and no titlebar. "none" asks for no decoration at all. Both are hints --
# the compositor can override either way.
preferred=none
