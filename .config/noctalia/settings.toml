# Noctalia settings declaration.
#
# Tracked so a fresh machine gets this session. Noctalia reads every *.toml
# here, THEN applies ~/.local/state/noctalia/settings.toml over it -- and the
# state file is what its settings UI writes. So on a machine that already has
# state, every key present in both is taken from state and this file is inert;
# on a machine without state (any fresh one) this file is the configuration.
#
# Therefore: after changing settings in the Noctalia UI, refresh this file, or
# it silently drifts and only the next machine finds out:
#
#   noctalia config export merged > ~/.config/noctalia/settings.toml
#   noctalia config validate
#
[bar.default]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]

[control_center]
hidden_tabs = [ "media", "audio" ]

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.panel]
launcher_placement = "attached"

[theme]
builtin = "Dracula"
community_palette = "Solarized"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"
