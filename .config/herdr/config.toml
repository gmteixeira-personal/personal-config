onboarding = false
[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"
host_cursor = "native"

# Create a tab straight away instead of asking for its name first; the name is
# a rename away for whoever wants one.
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

# Drop the tab row while a workspace holds a single tab; it comes back as
# soon as a second tab exists.
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "hostname" },
]

tab_bar_right_separator = "·"

[ui.toast]
# "terminal" asks the outer terminal for a desktop notification, which under
# WSL reaches nothing; "herdr" draws the toast inside herdr itself.
delivery = "herdr"

[keys]
prefix = "ctrl+space"

# Reach an agent by its position in the agent panel. Under the priority sort
# that panel is an attention queue, so a digit names whatever sits at that
# position now, not one particular agent.
focus_agent = "prefix+shift+1..9"

# Each creation key names what it creates: t for a tab, c for a workspace.
# This displaces the shipped keys — c created a tab, and shift+n created a
# workspace — and leaves shift+n unbound.
new_tab = "prefix+t"
new_workspace = "prefix+c"

# Closing is paired: the bare letter takes the smaller object, the shift the
# larger one. q closes a pane and shift+q its tab; d closes a workspace and
# shift+d detaches from the session entirely. This displaces the shipped keys —
# x closed a pane, shift+x a tab, shift+d a workspace, and q detached — leaving
# x and shift+x unbound. confirm_close still asks before a workspace goes.
# herdr binds one chord per action, so there is no prefix+w d sequence to be had.
close_pane = "prefix+q"
close_tab = "prefix+shift+q"
close_workspace = "prefix+d"
detach = "prefix+shift+d"

# Pane sizing, from the pane-equalizer plugin. The toggle script flips the
# plugin between equalizing on every pane change and leaving sizes alone; the
# two equalize keys work in either mode and do not change which one is set.
[[keys.command]]
key = "prefix+plus"
type = "shell"
command = "$HOME/.config/herdr/herdr-equalize-toggle"
description = "toggle pane auto-equalize"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "local.equalize-slots.equalize"
description = "equalize panes"

[[keys.command]]
key = "prefix+="
type = "plugin_action"
command = "local.equalize-slots.equalize"
description = "equalize panes"

[[keys.command]]
key = "prefix+backslash"
type = "shell"
command = '"$HERDR_BIN_PATH" pane zoom --pane "$HERDR_ACTIVE_PANE_ID" --toggle'
description = "toggle pane zoom"

[ui.sound]
enabled = true

[terminal]
# fish for the panes herdr opens, while /etc/passwd keeps bash. $SHELL stays
# /bin/bash, so ssh sessions, sudo -s, and anything running `$SHELL -c` with
# POSIX syntax are untouched; the change reaches interactive panes and nothing
# else.
#
# No fish-side environment setup is needed to make this work. Panes inherit the
# herdr server's environment, and the server is started from an interactive
# bash, so PATH, EDITOR, COLORTERM and the LS_COLORS bright-slot fix from
# ~/.bashrc are already in place. That inheritance is a snapshot taken when the
# server starts: a server launched from somewhere without those exports would
# hand fish a bare environment instead.
default_shell = "/usr/bin/fish"
